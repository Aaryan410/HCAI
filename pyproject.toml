[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hcai"
version = "1.0.1"
description = "A lightweight AI CLI powered by Hack Club AI."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

authors = [
    {name = "Aaryan Jadav"}
]

dependencies = [
    "requests"
]

[project.scripts]
hcai = "hcai.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
hcai = ["data/*.json"]